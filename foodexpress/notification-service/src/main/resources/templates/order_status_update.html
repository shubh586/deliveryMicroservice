<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Order Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7c59f 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .content {
            background: #f9f9f9;
            padding: 30px;
            border: 1px solid #ddd;
        }

        .status-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b35;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>
<div class="header">
    <h1 th:text="${appName}">FoodExpress</h1>
    <h2>Order Update</h2>
</div>

<div class="content">
    <p>Hi there,</p>
    <p>Here's an update on your order:</p>

    <div class="status-box">
        <p><strong>Order ID:</strong> <span th:text="${orderId}"></span></p>
        <p class="status" th:text="${status}"></p>
    </div>
</div>

<div class="footer">
    <p>Thank you for ordering with <span th:text="${appName}">FoodExpress</span>!</p>
</div>
</body>

</html>
